repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: \.py$

      - id: pytest-unit
        name: pytest (unit)
        entry: uv run pytest -m unit
        language: system
        pass_filenames: false
        always_run: true
