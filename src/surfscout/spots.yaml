    altura_min_m: 0.2
    altura_max_m: 0.6
  tamanho_ideal:
    altura_min_m: 0.4
    altura_max_m: 1.0
  notas: "Confirmado por você: funciona bem com ondulação de Leste e vento Sul — o morro protege o pico do vento sul, tornando-o efetivamente offshore ali. Também funciona bem da maré subindo até o começo da vazante; na maré seca fica muito cavada. Perfil parecido com o da Barra da Lagoa. Fundo de areia na foz de rio (banco móvel — revisar perfil periodicamente, pode mudar de forma após ressacas/enchentes). Cuidado com correnteza de retorno mesmo em ondas pequenas. Pesquisa (2026-09-09, mondo.surf/surf-forecast.com) ampliou a janela de swell para NE-SE e reclassificou o nível para intermediário — reveja se sua vivência pessoal discordar."

