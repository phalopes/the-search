  notas: "Praia extensa (3,5km) e de mar de tombo. Ideal com swell de S e vento offshore de NW. Confirmado por você: funciona bem da maré subindo até o começo da vazante; na maré seca (baixa-mar, principalmente em sizígia) fica muito cavada/fechada. Correnteza forte em dias maiores. A praia tem trechos distintos: o 'Pico' central é mais acessível, e o extremo norte ('Point do Riozinho') é mais oco/avançado (esse trecho não está mais cadastrado como pico separado nesta lista — decisão consciente de manter só Joaquina como 5º pico, perdendo o perfil de barril avançado que Riozinho tinha). Pesquisa (2026-09-09, surf-forecast.com/mondo.surf/stormrider.surf) confirma orientação sul e vento NW; ampliou o range de swell para incluir SE (~145°)."

