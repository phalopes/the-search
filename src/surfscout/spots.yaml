# Perfil estático dos picos — preenchido a partir de pesquisa (surf-forecast.com,
# breakfinder.surf, guias locais) em 2026-09-09. Não é 100% preciso: é a estimativa
# inicial pra sair do zero, conforme pedido. Ajuste os campos conforme sua própria
# vivência nos picos ao longo da validação da PoC — o campo `notas` de cada pico
# já aponta onde a fonte era ambígua ou onde vale mais atenção sua.
#
# Convenção de direção: graus 0-360, sentido "de onde vem" (N=0, E=90, S=180, W=270) —
# mesma convenção usada pelo Open-Meteo Marine e pelo Stormglass.
#
# `deslocamento_min` (tempo até o pico, em minutos) preenchido com os tempos reais
# informados por você em 2026-09-09.
#
# `nivel` — nível de surfista pra quem o pico costuma funcionar bem, escala:
# iniciante | iniciante-intermediario | intermediario | intermediario-avancado | avancado
#
# `mare_ideal.fase_preferida` — além da altura (que já captura "não é maré seca
# extrema"), alguns picos têm preferência pela FASE da maré (subindo vs descendo),
# não só pela altura absoluta. Valores: enchente | vazante | preamar | baixa-mar |
# enchente_ate_inicio_vazante | sem_preferencia_clara.
#
# `coordenadas` dos 5 picos reais atualizadas em 2026-09-10: substituídas as
# estimativas de pesquisa pela marcação pessoal sua no Windy.com (ponto exato de
# onde você costuma pegar onda em cada pico) — mais preciso pra consulta às APIs.

# ---------------------------------------------------------------------------
# PICOS REAIS
# ---------------------------------------------------------------------------

- id: mole
  nome: "Mole"
  regiao: "Florianópolis, SC"
  coordenadas:
    lat: -27.6020   # atualizado em 2026-09-10: marcação pessoal no Windy (onde você costuma pegar onda), substitui estimativa de pesquisa
    lon: -48.4280
  fundo: areia
  nivel: intermediario-avancado
  deslocamento_min: 35
  swell_ideal:
    direcao_min_graus: 90     # E
    direcao_max_graus: 140    # SE
    periodo_min_s: 8          # abaixo disso o groundswell chega fraco
    periodo_max_s: null
  vento_ideal:
    direcao_offshore_min_graus: 270   # W
    direcao_offshore_max_graus: 320   # NW
    velocidade_max_ms: 10             # acima disso o mar fica desalinhado mesmo offshore
  mare_ideal:
    fase_preferida: sem_preferencia_clara
    altura_min_m: 0.1
    altura_max_m: 0.6
  tamanho_ideal:
    altura_min_m: 0.8
    altura_max_m: 2.0
  notas: "Praia de mar aberto e fundo de areia, entre a Ponta do Gravatá e a Galheta. Onda forte e rápida, correnteza (repuxo) — nível intermediário/avançado. Ideal com swell de E-SE e vento offshore de W-NW (algumas fontes citam também S como componente favorável, tratar como bônus, não regra principal). Maré: funciona melhor baixa-média. Fonte: surf-forecast.com — cruzar com sua vivência."

