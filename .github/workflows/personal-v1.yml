name: Personal v1
on:
  push:
    branches: [codex/the-search-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: the-search-personal
  cancel-in-progress: false
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests scripts worker/src/entry.py
      - run: uv run ruff format --check src tests scripts worker/src/entry.py
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python scripts/prepare_worker.py
      - run: uv sync --directory worker --locked --python 3.13
      - name: Publish personal version
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          python ../scripts/ensure_subdomain.py
          uv run --python 3.13 pywrangler deploy
